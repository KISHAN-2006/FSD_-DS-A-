<body>

       </div> 
   <script>
        let item = {
            tea : 450,
            cofee : 600,
            sugar :700,
            pulses : 100
        }
        let items = prompt("enter the item which you have to buy");
        let no = prompt("Quantity of item");

         for(let i in item ){

                document.write(item[i] * no);
            }
         }
