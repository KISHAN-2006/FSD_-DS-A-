<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p id="demo">

    </p>
    <script>
        //code for ( FOR Loop)
        for(let i=1;i<=10;i++){
            document.write("<br> abes college");
        }

        let car = ["car1","car2","car3"];
        let text = " ";
        for(let i=0; i<car.length; i+=2){
            text += car[i] + "<br>";
        }
        document.getElementById("demo").innerHTML = text;


    </script>
</body>
</html>
